<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1400 990"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#a34f32" stroke-width="1.5"/></marker></defs><rect width="1400" height="990" fill="white"/><g font-family="Noto Sans CJK SC,Source Han Sans SC,sans-serif"><text x="48" y="57" font-size="29" fill="#283c33" text-anchor="start">D05  直轨与站台布置</text><text x="48" y="92" font-size="19" fill="#a34f32" text-anchor="start">单位 mm｜R0 工程布局稿｜数字为设计值，不是实测板尺寸｜禁止直接量产</text><line x1="45" y1="112" x2="1355" y2="112" stroke="#283c33" stroke-width="2" /><text x="70" y="155" font-size="23" fill="#283c33" text-anchor="start">直轨俯视图</text><rect x="80" y="200" width="600" height="336" rx="0" fill="#f6f3eb" stroke="#283c33" stroke-width="2"/><rect x="80" y="230" width="600" height="20" rx="0" fill="#dce8d6" stroke="#283c33" stroke-width="2"/><rect x="80" y="486" width="600" height="20" rx="0" fill="#dce8d6" stroke="#283c33" stroke-width="2"/><line x1="80" y1="175" x2="680" y2="175" stroke="#718177" stroke-width="2" /><line x1="80" y1="166" x2="80" y2="184" stroke="#718177" stroke-width="2" /><line x1="680" y1="166" x2="680" y2="184" stroke="#718177" stroke-width="2" /><text x="380" y="163" font-size="20" fill="#283c33" text-anchor="middle">单段长 150</text><line x1="721" y1="200" x2="721" y2="536" stroke="#718177" stroke-width="2" /><line x1="712" y1="200" x2="730" y2="200" stroke="#718177" stroke-width="2" /><line x1="712" y1="536" x2="730" y2="536" stroke="#718177" stroke-width="2" /><text transform="translate(747,368) rotate(-90)" text-anchor="middle" font-size="20" fill="#283c33">基板宽 84</text><line x1="765" y1="250" x2="765" y2="486" stroke="#718177" stroke-width="2" /><line x1="756" y1="250" x2="774" y2="250" stroke="#718177" stroke-width="2" /><line x1="756" y1="486" x2="774" y2="486" stroke="#718177" stroke-width="2" /><text transform="translate(791,368) rotate(-90)" text-anchor="middle" font-size="20" fill="#283c33">两轨内侧净距 59</text><text x="845" y="174" font-size="23" fill="#283c33" text-anchor="start">轨道横断面</text><rect x="860" y="423" width="336" height="16" rx="0" fill="#f6f3eb" stroke="#283c33" stroke-width="2"/><rect x="890" y="411" width="20" height="12" rx="0" fill="#dce8d6" stroke="#283c33" stroke-width="2"/><rect x="1146" y="411" width="20" height="12" rx="0" fill="#dce8d6" stroke="#283c33" stroke-width="2"/><line x1="900" y1="378" x2="1156" y2="378" stroke="#718177" stroke-width="2" /><line x1="900" y1="369" x2="900" y2="387" stroke="#718177" stroke-width="2" /><line x1="1156" y1="369" x2="1156" y2="387" stroke="#718177" stroke-width="2" /><text x="1028" y="366" font-size="20" fill="#283c33" text-anchor="middle">轨中心距 64</text><text x="850" y="480" font-size="20" fill="#283c33" text-anchor="start">底板厚4；轨宽5；轨高3。</text><text x="850" y="516" font-size="20" fill="#283c33" text-anchor="start">总厚7；不导电，不接电池。</text><text x="850" y="552" font-size="20" fill="#a34f32" text-anchor="start">这是自定义轨道，不兼容现成轨距。</text><text x="75" y="608" font-size="22" fill="#283c33" text-anchor="start">展示底板布局：建议 600 × 200 ×6 木板（不属于打印CAD）</text><rect x="80" y="637" width="720" height="240" rx="0" fill="#f6f3eb" stroke="#718177" stroke-width="2"/><rect x="80" y="707" width="180" height="100.8" rx="0" fill="white" stroke="#718177" stroke-width="2"/><line x1="80" y1="719" x2="260" y2="719" stroke="#283c33" stroke-width="2" /><line x1="80" y1="796" x2="260" y2="796" stroke="#283c33" stroke-width="2" /><rect x="260" y="707" width="180" height="100.8" rx="0" fill="white" stroke="#718177" stroke-width="2"/><line x1="260" y1="719" x2="440" y2="719" stroke="#283c33" stroke-width="2" /><line x1="260" y1="796" x2="440" y2="796" stroke="#283c33" stroke-width="2" /><rect x="440" y="707" width="180" height="100.8" rx="0" fill="white" stroke="#718177" stroke-width="2"/><line x1="440" y1="719" x2="620" y2="719" stroke="#283c33" stroke-width="2" /><line x1="440" y1="796" x2="620" y2="796" stroke="#283c33" stroke-width="2" /><rect x="620" y="707" width="180" height="100.8" rx="0" fill="white" stroke="#718177" stroke-width="2"/><line x1="620" y1="719" x2="800" y2="719" stroke="#283c33" stroke-width="2" /><line x1="620" y1="796" x2="800" y2="796" stroke="#283c33" stroke-width="2" /><rect x="87" y="707" width="12" height="100.8" rx="0" fill="#dce8d6" stroke="#283c33" stroke-width="2"/><rect x="781" y="707" width="12" height="100.8" rx="0" fill="#dce8d6" stroke="#283c33" stroke-width="2"/><rect x="240" y="660" width="72" height="42" rx="0" fill="#dce8d6" stroke="#283c33" stroke-width="2"/><rect x="590" y="812" width="72" height="42" rx="0" fill="#dce8d6" stroke="#283c33" stroke-width="2"/><text x="276" y="688" font-size="16" fill="#283c33" text-anchor="middle">青叶站</text><text x="626" y="840" font-size="16" fill="#283c33" text-anchor="middle">拾迹站</text><text x="850" y="663" font-size="19" fill="#283c33" text-anchor="start">轨道4段平口对接，共600长。</text><text x="850" y="694" font-size="19" fill="#283c33" text-anchor="start">先在底板上拉中心线，再固定。</text><text x="850" y="725" font-size="19" fill="#283c33" text-anchor="start">接缝错台目标≤0.2，手推不绊轮。</text><text x="850" y="756" font-size="19" fill="#283c33" text-anchor="start">两端固定P07挡块，内侧贴软垫。</text><text x="850" y="787" font-size="19" fill="#283c33" text-anchor="start">站台仅作布景，首版不自动识别。</text><text x="850" y="818" font-size="19" fill="#283c33" text-anchor="start">可在站牌贴NFC标签供手机读，</text><text x="850" y="849" font-size="19" fill="#283c33" text-anchor="start">不能因此让黄山派自动读到站。</text><line x1="45" y1="930" x2="1355" y2="930" stroke="#283c33" stroke-width="2" /><text x="48" y="958" font-size="17" fill="#283c33" text-anchor="start">拾迹小火车  |  2026-09-13  |  按标注数字读图，不按显示或打印比例量取</text><text x="1350" y="958" font-size="17" fill="#a34f32" text-anchor="end">HOLD / 实测与试片后放行</text></g></svg>