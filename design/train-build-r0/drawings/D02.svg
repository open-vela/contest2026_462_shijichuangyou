<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1400 990"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#a34f32" stroke-width="1.5"/></marker></defs><rect width="1400" height="990" fill="white"/><g font-family="Noto Sans CJK SC,Source Han Sans SC,sans-serif"><text x="48" y="57" font-size="29" fill="#283c33" text-anchor="start">D02  独立核心包络与实测要求</text><text x="48" y="92" font-size="19" fill="#a34f32" text-anchor="start">单位 mm｜R0 工程布局稿｜数字为设计值，不是实测板尺寸｜禁止直接量产</text><line x1="45" y1="112" x2="1355" y2="112" stroke="#283c33" stroke-width="2" /><text x="70" y="154" font-size="23" fill="#283c33" text-anchor="start">外部标准包络（拟定）</text><rect x="100" y="210" width="350" height="390" rx="16" fill="#f6f3eb" stroke="#283c33" stroke-width="2"/><line x1="100" y1="181" x2="450" y2="181" stroke="#718177" stroke-width="2" /><line x1="100" y1="172" x2="100" y2="190" stroke="#718177" stroke-width="2" /><line x1="450" y1="172" x2="450" y2="190" stroke="#718177" stroke-width="2" /><text x="275" y="169" font-size="20" fill="#283c33" text-anchor="middle">Cw = 70（拟定）</text><line x1="70" y1="210" x2="70" y2="600" stroke="#718177" stroke-width="2" /><line x1="61" y1="210" x2="79" y2="210" stroke="#718177" stroke-width="2" /><line x1="61" y1="600" x2="79" y2="600" stroke="#718177" stroke-width="2" /><text transform="translate(96,405) rotate(-90)" text-anchor="middle" font-size="20" fill="#283c33">Ch = 78（拟定）</text><rect x="155" y="275" width="240" height="225" rx="4" fill="none" stroke="#718177" stroke-width="2"/><text x="275" y="352" font-size="20" fill="#718177" text-anchor="middle">实际玻璃与显示区域</text><text x="275" y="388" font-size="20" fill="#a34f32" text-anchor="middle">位置、宽高待实测</text><text x="104" y="639" font-size="20" fill="#a34f32" text-anchor="start">正面：不能按效果图开玻璃孔</text><rect x="545" y="210" width="140" height="390" rx="8" fill="#f6f3eb" stroke="#283c33" stroke-width="2"/><line x1="545" y1="181" x2="685" y2="181" stroke="#718177" stroke-width="2" /><line x1="545" y1="172" x2="545" y2="190" stroke="#718177" stroke-width="2" /><line x1="685" y1="172" x2="685" y2="190" stroke="#718177" stroke-width="2" /><text x="615" y="169" font-size="20" fill="#283c33" text-anchor="middle">Ct = 28（拟定）</text><text x="615" y="420" font-size="22" fill="#718177" text-anchor="middle">侧视</text><text x="785" y="176" font-size="19" fill="#283c33" text-anchor="start">必须回填 MEASUREMENTS.csv：</text><text x="785" y="207" font-size="19" fill="#283c33" text-anchor="start">M01–03 主板、屏幕与排线包络</text><text x="785" y="238" font-size="19" fill="#283c33" text-anchor="start">M04–06 玻璃、触摸区与偏移</text><text x="785" y="269" font-size="19" fill="#283c33" text-anchor="start">M07–09 USB、按键与安装孔坐标</text><text x="785" y="300" font-size="19" fill="#283c33" text-anchor="start">M10 成品保护电池的实际长宽厚</text><text x="785" y="331" font-size="19" fill="#283c33" text-anchor="start">M11 板端与电池插头的真实极性</text><text x="785" y="362" font-size="19" fill="#283c33" text-anchor="start">M12–13 封装后总尺寸与重量</text><text x="785" y="393" font-size="19" fill="#283c33" text-anchor="start">M14 充电上限、电流与保护条件</text><text x="785" y="424" font-size="19" fill="#283c33" text-anchor="start"></text><text x="785" y="455" font-size="19" fill="#283c33" text-anchor="start">电池电芯参考（不是成品包尺寸）：</text><text x="785" y="486" font-size="19" fill="#283c33" text-anchor="start">EEMB LP503450 / 3.7V / 950mAh</text><text x="785" y="517" font-size="19" fill="#283c33" text-anchor="start">电芯上限 52 × 34.5 × 5.3。</text><text x="785" y="548" font-size="19" fill="#283c33" text-anchor="start">保护板、胶带与线根会改变包络。</text><rect x="80" y="710" width="620" height="128" rx="5" fill="#dce8d6" stroke="#718177" stroke-width="2"/><text x="105" y="747" font-size="23" fill="#283c33" text-anchor="start">内胆分层原则</text><text x="105" y="784" font-size="19" fill="#283c33" text-anchor="start">玻璃边框承托 → 屏幕/主板固定 → 绝缘隔离 → 电池保护腔</text><text x="105" y="815" font-size="19" fill="#283c33" text-anchor="start">不压元件、不折死排线、不用螺钉顶住电池。</text><text x="790" y="727" font-size="19" fill="#283c33" text-anchor="start">R0 只交付 core_proxy 假核心量规。</text><text x="790" y="758" font-size="19" fill="#283c33" text-anchor="start">它是实心块，不能装电子件。</text><text x="790" y="789" font-size="19" fill="#283c33" text-anchor="start">内胆前后壳和接口开孔尚未出加工模型。</text><text x="790" y="820" font-size="19" fill="#283c33" text-anchor="start">实测补图是整套打印的前置停止点。</text><line x1="45" y1="930" x2="1355" y2="930" stroke="#283c33" stroke-width="2" /><text x="48" y="958" font-size="17" fill="#283c33" text-anchor="start">拾迹小火车  |  2026-09-13  |  按标注数字读图，不按显示或打印比例量取</text><text x="1350" y="958" font-size="17" fill="#a34f32" text-anchor="end">HOLD / 实测与试片后放行</text></g></svg>