<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1400 990"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#a34f32" stroke-width="1.5"/></marker></defs><rect width="1400" height="990" fill="white"/><g font-family="Noto Sans CJK SC,Source Han Sans SC,sans-serif"><text x="48" y="57" font-size="29" fill="#283c33" text-anchor="start">D03  滑入卡座与车顶防脱结构</text><text x="48" y="92" font-size="19" fill="#a34f32" text-anchor="start">单位 mm｜R0 工程布局稿｜数字为设计值，不是实测板尺寸｜禁止直接量产</text><line x1="45" y1="112" x2="1355" y2="112" stroke="#283c33" stroke-width="2" /><text x="70" y="156" font-size="23" fill="#283c33" text-anchor="start">核心卡座水平剖面（向下看）</text><rect x="160" y="240" width="805" height="24" rx="0" fill="#f6f3eb" stroke="#283c33" stroke-width="2"/><rect x="185" y="264" width="24" height="285" rx="0" fill="#dce8d6" stroke="#283c33" stroke-width="2"/><rect x="917" y="264" width="24" height="285" rx="0" fill="#dce8d6" stroke="#283c33" stroke-width="2"/><rect x="185" y="525" width="756" height="24" rx="0" fill="#dce8d6" stroke="#283c33" stroke-width="2"/><rect x="213" y="268" width="700" height="280" rx="6" fill="#f6f3eb" stroke="#718177" stroke-width="2"/><text x="563" y="390" font-size="26" fill="#283c33" text-anchor="middle">完整核心 70 × 28</text><line x1="209" y1="213" x2="917" y2="213" stroke="#718177" stroke-width="2" /><line x1="209" y1="204" x2="209" y2="222" stroke="#718177" stroke-width="2" /><line x1="917" y1="204" x2="917" y2="222" stroke="#718177" stroke-width="2" /><text x="563" y="201" font-size="20" fill="#283c33" text-anchor="middle">卡座内宽 Cw + 2g = 70.8</text><line x1="1010" y1="264" x2="1010" y2="552" stroke="#718177" stroke-width="2" /><line x1="1001" y1="264" x2="1019" y2="264" stroke="#718177" stroke-width="2" /><line x1="1001" y1="552" x2="1019" y2="552" stroke="#718177" stroke-width="2" /><text transform="translate(1036,408) rotate(-90)" text-anchor="middle" font-size="20" fill="#283c33">有效深度 Ct + 2g = 28.8</text><text x="70" y="611" font-size="22" fill="#a34f32" text-anchor="start">g = 0.4 单边设计间隙；必须由同工艺试片确认。</text><text x="70" y="656" font-size="21" fill="#283c33" text-anchor="start">前侧窗口：宽 Cw−6，高 Ch−6；每边遮住核心外壳 3。</text><text x="70" y="691" font-size="21" fill="#283c33" text-anchor="start">此处是车体窗口，不是玻璃孔；如遮挡触控区，必须改图。</text><rect x="1130" y="245" width="150" height="18" rx="0" fill="#dce8d6" stroke="#283c33" stroke-width="2"/><rect x="1135" y="263" width="30" height="35" rx="0" fill="#dce8d6" stroke="#283c33" stroke-width="2"/><rect x="1135" y="303" width="95" height="230" rx="0" fill="#f6f3eb" stroke="#718177" stroke-width="2"/><text x="1112" y="197" font-size="21" fill="#283c33" text-anchor="start">车顶限位局部</text><line x1="1303" y1="298" x2="1303" y2="303" stroke="#718177" stroke-width="2" /><line x1="1294" y1="298" x2="1312" y2="298" stroke="#718177" stroke-width="2" /><line x1="1294" y1="303" x2="1312" y2="303" stroke="#718177" stroke-width="2" /><text transform="translate(1329,300.5) rotate(-90)" text-anchor="middle" font-size="20" fill="#283c33">0.5</text><line x1="1110" y1="283" x2="1133" y2="283" stroke="#a34f32" stroke-width="3" marker-end="url(#arrow)"/><text x="1090" y="590" font-size="19" fill="#283c33" text-anchor="start">只挡住核心壳体上沿。</text><text x="1090" y="621" font-size="19" fill="#283c33" text-anchor="start">不得压玻璃或裸电池。</text><text x="1090" y="652" font-size="19" fill="#283c33" text-anchor="start">2颗M3手拧螺钉锁车顶。</text><text x="1090" y="683" font-size="19" fill="#283c33" text-anchor="start">松开后，整颗核心上抽。</text><text x="70" y="773" font-size="19" fill="#283c33" text-anchor="start">车顶螺钉：M3×8 作为首轮候选；实装核对啮合长度。</text><text x="70" y="804" font-size="19" fill="#283c33" text-anchor="start">螺母槽：对边 5.8，深 3；先拿实际螺母做试片。</text><text x="70" y="835" font-size="19" fill="#283c33" text-anchor="start">卡座面、轴孔和螺母槽禁喷漆；不得靠强压解决不合。</text><text x="70" y="866" font-size="19" fill="#283c33" text-anchor="start">本剖面是尺寸关系示意，不按图上线长直接切料。</text><line x1="45" y1="930" x2="1355" y2="930" stroke="#283c33" stroke-width="2" /><text x="48" y="958" font-size="17" fill="#283c33" text-anchor="start">拾迹小火车  |  2026-09-13  |  按标注数字读图，不按显示或打印比例量取</text><text x="1350" y="958" font-size="17" fill="#a34f32" text-anchor="end">HOLD / 实测与试片后放行</text></g></svg>