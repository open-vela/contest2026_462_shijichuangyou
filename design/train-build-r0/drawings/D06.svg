<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1400 990"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#a34f32" stroke-width="1.5"/></marker></defs><rect width="1400" height="990" fill="white"/><g font-family="Noto Sans CJK SC,Source Han Sans SC,sans-serif"><text x="48" y="57" font-size="29" fill="#283c33" text-anchor="start">D06  滑槽与轴孔配合试片</text><text x="48" y="92" font-size="19" fill="#a34f32" text-anchor="start">单位 mm｜R0 工程布局稿｜数字为设计值，不是实测板尺寸｜禁止直接量产</text><line x1="45" y1="112" x2="1355" y2="112" stroke="#283c33" stroke-width="2" /><text x="65" y="156" font-size="24" fill="#283c33" text-anchor="start">只先打印这一组配合试片，再决定整套间隙</text><rect x="100" y="215" width="560" height="340" rx="0" fill="#f6f3eb" stroke="#283c33" stroke-width="2"/><rect x="120" y="295" width="106" height="260" rx="0" fill="#dce8d6" stroke="#283c33" stroke-width="2"/><circle cx="170" cy="255" r="15" fill="none" stroke="#283c33" stroke-width="2"/><text x="173" y="598" font-size="23" fill="#283c33" text-anchor="middle">g=0.3</text><rect x="300" y="295" width="108" height="260" rx="0" fill="#dce8d6" stroke="#283c33" stroke-width="2"/><circle cx="350" cy="255" r="16" fill="none" stroke="#283c33" stroke-width="2"/><text x="353" y="598" font-size="23" fill="#283c33" text-anchor="middle">g=0.4</text><rect x="480" y="295" width="110" height="260" rx="0" fill="#dce8d6" stroke="#283c33" stroke-width="2"/><circle cx="530" cy="255" r="17" fill="none" stroke="#283c33" stroke-width="2"/><text x="533" y="598" font-size="23" fill="#283c33" text-anchor="middle">g=0.5</text><line x1="100" y1="187" x2="660" y2="187" stroke="#718177" stroke-width="2" /><line x1="100" y1="178" x2="100" y2="196" stroke="#718177" stroke-width="2" /><line x1="660" y1="178" x2="660" y2="196" stroke="#718177" stroke-width="2" /><text x="380" y="175" font-size="20" fill="#283c33" text-anchor="middle">试片宽56</text><line x1="710" y1="215" x2="710" y2="555" stroke="#718177" stroke-width="2" /><line x1="701" y1="215" x2="719" y2="215" stroke="#718177" stroke-width="2" /><line x1="701" y1="555" x2="719" y2="555" stroke="#718177" stroke-width="2" /><text transform="translate(736,385) rotate(-90)" text-anchor="middle" font-size="20" fill="#283c33">长34 / 厚8</text><rect x="890" y="255" width="100" height="200" rx="0" fill="#dce8d6" stroke="#283c33" stroke-width="2"/><line x1="890" y1="232" x2="990" y2="232" stroke="#718177" stroke-width="2" /><line x1="890" y1="223" x2="890" y2="241" stroke="#718177" stroke-width="2" /><line x1="990" y1="223" x2="990" y2="241" stroke="#718177" stroke-width="2" /><text x="940" y="220" font-size="20" fill="#283c33" text-anchor="middle">插片宽10</text><line x1="1040" y1="255" x2="1040" y2="455" stroke="#718177" stroke-width="2" /><line x1="1031" y1="255" x2="1049" y2="255" stroke="#718177" stroke-width="2" /><line x1="1031" y1="455" x2="1049" y2="455" stroke="#718177" stroke-width="2" /><text transform="translate(1066,355) rotate(-90)" text-anchor="middle" font-size="20" fill="#283c33">长20 / 厚4</text><text x="825" y="557" font-size="19" fill="#283c33" text-anchor="start">左至右：单边间隙0.3 / 0.4 / 0.5。</text><text x="825" y="588" font-size="19" fill="#283c33" text-anchor="start">孔径左至右：3.0 / 3.2 / 3.4。</text><text x="825" y="619" font-size="19" fill="#283c33" text-anchor="start">试片和插片用同批材料、同工艺打印。</text><text x="825" y="650" font-size="19" fill="#283c33" text-anchor="start">先试清理后尺寸，再试最终表面处理。</text><text x="80" y="728" font-size="19" fill="#283c33" text-anchor="start">选合：不掰、不敲即可滑入，反复插拔后不明显晃动；不同供应商结果可能不同。</text><text x="80" y="759" font-size="19" fill="#283c33" text-anchor="start">孔试配：使用同一根Φ3光轴，必要时远离电子件手工修孔，不以标称孔径直接判合格。</text><text x="80" y="790" font-size="19" fill="#283c33" text-anchor="start">这是工艺选择试片，不替代实际长导轨验证；完整卡座必须再用假核心装配测试。</text><text x="80" y="821" font-size="19" fill="#283c33" text-anchor="start">只提供R0 CAD源码，本轮未运行CAD渲染或导出STL。请供应商先做模型检查后再打印试片。</text><line x1="45" y1="930" x2="1355" y2="930" stroke="#283c33" stroke-width="2" /><text x="48" y="958" font-size="17" fill="#283c33" text-anchor="start">拾迹小火车  |  2026-09-13  |  按标注数字读图，不按显示或打印比例量取</text><text x="1350" y="958" font-size="17" fill="#a34f32" text-anchor="end">HOLD / 实测与试片后放行</text></g></svg>