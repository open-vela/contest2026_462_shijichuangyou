<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1400 990"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#a34f32" stroke-width="1.5"/></marker></defs><rect width="1400" height="990" fill="white"/><g font-family="Noto Sans CJK SC,Source Han Sans SC,sans-serif"><text x="48" y="57" font-size="29" fill="#283c33" text-anchor="start">D04  轮轴剖面与五金装配</text><text x="48" y="92" font-size="19" fill="#a34f32" text-anchor="start">单位 mm｜R0 工程布局稿｜数字为设计值，不是实测板尺寸｜禁止直接量产</text><line x1="45" y1="112" x2="1355" y2="112" stroke="#283c33" stroke-width="2" /><text x="65" y="156" font-size="23" fill="#283c33" text-anchor="start">单根轴的横向装配  Y方向（整车共2根）</text><line x1="230" y1="385" x2="1070" y2="385" stroke="#718177" stroke-width="2" /><rect x="230" y="377" width="840" height="16" rx="0" fill="#b8c1c5" stroke="#718177" stroke-width="2"/><rect x="237" y="347.5" width="50" height="75" rx="0" fill="#dce8d6" stroke="#283c33" stroke-width="2"/><rect x="290" y="245" width="80" height="280" rx="0" fill="#f6f3eb" stroke="#283c33" stroke-width="2"/><rect x="370" y="225" width="20" height="320" rx="0" fill="#dce8d6" stroke="#283c33" stroke-width="2"/><rect x="390" y="356" width="20" height="58" rx="0" fill="white" stroke="#283c33" stroke-width="2"/><rect x="410" y="265" width="80" height="240" rx="0" fill="#f6f3eb" stroke="#283c33" stroke-width="2"/><rect x="810" y="265" width="80" height="240" rx="0" fill="#f6f3eb" stroke="#283c33" stroke-width="2"/><rect x="890" y="356" width="20" height="58" rx="0" fill="white" stroke="#283c33" stroke-width="2"/><rect x="910" y="225" width="20" height="320" rx="0" fill="#dce8d6" stroke="#283c33" stroke-width="2"/><rect x="930" y="245" width="80" height="280" rx="0" fill="#f6f3eb" stroke="#283c33" stroke-width="2"/><rect x="1013" y="347.5" width="50" height="75" rx="0" fill="#dce8d6" stroke="#283c33" stroke-width="2"/><line x1="230" y1="624" x2="1070" y2="624" stroke="#718177" stroke-width="2" /><line x1="230" y1="615" x2="230" y2="633" stroke="#718177" stroke-width="2" /><line x1="1070" y1="615" x2="1070" y2="633" stroke="#718177" stroke-width="2" /><text x="650" y="612" font-size="20" fill="#283c33" text-anchor="middle">光轴 Φ3 ×84；两端去毛刺</text><line x1="330" y1="661" x2="970" y2="661" stroke="#718177" stroke-width="2" /><line x1="330" y1="652" x2="330" y2="670" stroke="#718177" stroke-width="2" /><line x1="970" y1="652" x2="970" y2="670" stroke="#718177" stroke-width="2" /><text x="650" y="649" font-size="20" fill="#283c33" text-anchor="middle">踏面中心距 64</text><text x="220" y="213" font-size="20" fill="#a34f32" text-anchor="start">轮缘朝车体中心</text><line x1="344" y1="225" x2="379" y2="239" stroke="#a34f32" stroke-width="3" marker-end="url(#arrow)"/><line x1="965" y1="225" x2="920" y2="239" stroke="#a34f32" stroke-width="3" marker-end="url(#arrow)"/><text x="70" y="729" font-size="19" fill="#283c33" text-anchor="start">从左到右：限位环 / 左轮 / 2片尼龙垫片 / 左轴座 / 右轴座 / 2片垫片 / 右轮 / 限位环。</text><text x="70" y="760" font-size="19" fill="#283c33" text-anchor="start">轮：踏面 Φ28×8；内侧轮缘 Φ32×2；总厚10；孔 Φ3.2（以实配为准）。</text><text x="70" y="791" font-size="19" fill="#283c33" text-anchor="start">轴座：孔 Φ3.3；中心位置 Y=±20；每座宽8，外侧端面 Y=±24。</text><text x="70" y="822" font-size="19" fill="#283c33" text-anchor="start">垫片：每轮内侧2片，内径3.2、厚1；限位环内径3、厚5，锁紧前留小量转动间隙。</text><text x="70" y="853" font-size="19" fill="#283c33" text-anchor="start">四轮可各自绕轴转动；不要胶死车轮。孔修整必须在安装电子件之前完成。</text><text x="70" y="884" font-size="19" fill="#283c33" text-anchor="start">本轮为直轨手推结构，不宣称能通过效果图中的小半径弯轨。</text><text x="1112" y="258" font-size="19" fill="#283c33" text-anchor="start">首轮五金：</text><text x="1112" y="289" font-size="19" fill="#283c33" text-anchor="start">光轴 ×2</text><text x="1112" y="320" font-size="19" fill="#283c33" text-anchor="start">车轮 ×4</text><text x="1112" y="351" font-size="19" fill="#283c33" text-anchor="start">尼龙垫片 ×8</text><text x="1112" y="382" font-size="19" fill="#283c33" text-anchor="start">轴限位环 ×4</text><text x="1112" y="413" font-size="19" fill="#283c33" text-anchor="start"></text><text x="1112" y="444" font-size="19" fill="#283c33" text-anchor="start">轴向总窜动目标</text><text x="1112" y="475" font-size="19" fill="#283c33" text-anchor="start">0.2–0.5，</text><text x="1112" y="506" font-size="19" fill="#283c33" text-anchor="start">以装配实测为准。</text><line x1="45" y1="930" x2="1355" y2="930" stroke="#283c33" stroke-width="2" /><text x="48" y="958" font-size="17" fill="#283c33" text-anchor="start">拾迹小火车  |  2026-09-13  |  按标注数字读图，不按显示或打印比例量取</text><text x="1350" y="958" font-size="17" fill="#a34f32" text-anchor="end">HOLD / 实测与试片后放行</text></g></svg>