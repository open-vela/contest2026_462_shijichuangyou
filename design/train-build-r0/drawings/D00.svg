<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1400 990"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#a34f32" stroke-width="1.5"/></marker></defs><rect width="1400" height="990" fill="white"/><g font-family="Noto Sans CJK SC,Source Han Sans SC,sans-serif"><text x="48" y="57" font-size="29" fill="#283c33" text-anchor="start">D00  总装与拆卸示意</text><text x="48" y="92" font-size="19" fill="#a34f32" text-anchor="start">单位 mm｜R0 工程布局稿｜数字为设计值，不是实测板尺寸｜禁止直接量产</text><line x1="45" y1="112" x2="1355" y2="112" stroke="#283c33" stroke-width="2" /><text x="70" y="155" font-size="24" fill="#283c33" text-anchor="start">装配层次与核心取出方向</text><rect x="135" y="205" width="455" height="27" rx="10" fill="#dce8d6" stroke="#283c33" stroke-width="2"/><text x="620" y="226" font-size="22" fill="#283c33" text-anchor="start">P03 可拆车顶 + 2 颗 M3 手拧螺钉</text><rect x="210" y="292" width="210" height="234" rx="10" fill="#f6f3eb" stroke="#283c33" stroke-width="2"/><rect x="233" y="327" width="164" height="168" rx="4" fill="#dce8d6" stroke="#718177" stroke-width="2"/><text x="445" y="357" font-size="23" fill="#283c33" text-anchor="start">P00 完整独立核心</text><text x="445" y="391" font-size="20" fill="#283c33" text-anchor="start">拟定包络 70 × 78 × 28</text><text x="445" y="424" font-size="20" fill="#a34f32" text-anchor="start">不是裸屏；内胆需要实物补图</text><line x1="315" y1="282" x2="315" y2="244" stroke="#a34f32" stroke-width="3" marker-end="url(#arrow)"/><rect x="130" y="575" width="470" height="105" rx="8" fill="#f6f3eb" stroke="#283c33" stroke-width="2"/><rect x="200" y="570" width="225" height="100" rx="0" fill="white" stroke="#718177" stroke-width="2"/><text x="640" y="614" font-size="22" fill="#283c33" text-anchor="start">P02 车体与顶部开放式核心卡座</text><text x="640" y="647" font-size="20" fill="#283c33" text-anchor="start">侧面显示；从顶部垂直抽取</text><line x1="315" y1="540" x2="315" y2="568" stroke="#a34f32" stroke-width="3" marker-end="url(#arrow)"/><rect x="130" y="743" width="470" height="24" rx="0" fill="#dce8d6" stroke="#283c33" stroke-width="2"/><text x="640" y="764" font-size="22" fill="#283c33" text-anchor="start">P01 底盘 + 4 个轴支撑</text><circle cx="205" cy="829" r="44" fill="#f6f3eb" stroke="#283c33" stroke-width="2"/><circle cx="205" cy="829" r="8" fill="none" stroke="#283c33" stroke-width="2"/><circle cx="520" cy="829" r="44" fill="#f6f3eb" stroke="#283c33" stroke-width="2"/><circle cx="520" cy="829" r="8" fill="none" stroke="#283c33" stroke-width="2"/><line x1="180" y1="829" x2="550" y2="829" stroke="#718177" stroke-width="2" /><text x="640" y="831" font-size="22" fill="#283c33" text-anchor="start">P04 车轮 ×4 / Φ3 ×84 光轴 ×2</text><text x="845" y="235" font-size="19" fill="#283c33" text-anchor="start">拆卸：</text><text x="845" y="266" font-size="19" fill="#283c33" text-anchor="start">1. 先拔掉外接 USB 线。</text><text x="845" y="297" font-size="19" fill="#283c33" text-anchor="start">2. 松开两颗手拧螺钉。</text><text x="845" y="328" font-size="19" fill="#283c33" text-anchor="start">3. 提起车顶，不拉电线。</text><text x="845" y="359" font-size="19" fill="#283c33" text-anchor="start">4. 握住核心壳体向上抽出。</text><text x="845" y="390" font-size="19" fill="#283c33" text-anchor="start">5. 核心独立运行。</text><text x="845" y="421" font-size="19" fill="#283c33" text-anchor="start"></text><text x="845" y="452" font-size="19" fill="#283c33" text-anchor="start">首版不使用磁吸供电；</text><text x="845" y="483" font-size="19" fill="#283c33" text-anchor="start">车顶是机械防脱件，</text><text x="845" y="514" font-size="19" fill="#283c33" text-anchor="start">不是电池压板。</text><line x1="45" y1="930" x2="1355" y2="930" stroke="#283c33" stroke-width="2" /><text x="48" y="958" font-size="17" fill="#283c33" text-anchor="start">拾迹小火车  |  2026-09-13  |  按标注数字读图，不按显示或打印比例量取</text><text x="1350" y="958" font-size="17" fill="#a34f32" text-anchor="end">HOLD / 实测与试片后放行</text></g></svg>