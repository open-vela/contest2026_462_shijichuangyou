<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1400 990"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#a34f32" stroke-width="1.5"/></marker></defs><rect width="1400" height="990" fill="white"/><g font-family="Noto Sans CJK SC,Source Han Sans SC,sans-serif"><text x="48" y="57" font-size="29" fill="#283c33" text-anchor="start">E01  电池与供电停止点</text><text x="48" y="92" font-size="19" fill="#a34f32" text-anchor="start">单位 mm｜R0 工程布局稿｜数字为设计值，不是实测板尺寸｜禁止直接量产</text><line x1="45" y1="112" x2="1355" y2="112" stroke="#283c33" stroke-width="2" /><text x="65" y="156" font-size="24" fill="#283c33" text-anchor="start">电源连接逻辑（非针脚焊接图）</text><rect x="75" y="228" width="235" height="140" rx="8" fill="#f6f3eb" stroke="#283c33" stroke-width="2"/><text x="193" y="277" font-size="22" fill="#283c33" text-anchor="middle">合规 USB 5V 电源</text><text x="193" y="319" font-size="20" fill="#283c33" text-anchor="middle">现有 Type-C 口</text><rect x="440" y="210" width="355" height="220" rx="8" fill="#dce8d6" stroke="#283c33" stroke-width="2"/><text x="618" y="258" font-size="24" fill="#283c33" text-anchor="middle">黄山派原有电源系统</text><text x="618" y="310" font-size="20" fill="#283c33" text-anchor="middle">充电芯片 / 电池座 / 系统负载</text><text x="618" y="360" font-size="19" fill="#283c33" text-anchor="middle">屏幕、主板由核心内部供电</text><rect x="935" y="210" width="360" height="220" rx="8" fill="#f6f3eb" stroke="#283c33" stroke-width="2"/><text x="1115" y="260" font-size="23" fill="#283c33" text-anchor="middle">1S 带保护成品电池包</text><text x="1115" y="305" font-size="19" fill="#283c33" text-anchor="middle">候选 EEMB LP503450 电芯</text><text x="1115" y="348" font-size="18" fill="#283c33" text-anchor="middle">3.7V / 950mAh / 4.2V充电体系</text><text x="1115" y="390" font-size="19" fill="#283c33" text-anchor="middle">保护板 + 引线 + 匹配插头</text><line x1="310" y1="291" x2="437" y2="291" stroke="#a34f32" stroke-width="3" marker-end="url(#arrow)"/><line x1="795" y1="272" x2="935" y2="272" stroke="#a34f32" stroke-width="2" /><line x1="795" y1="361" x2="935" y2="361" stroke="#283c33" stroke-width="2" /><text x="810" y="250" font-size="18" fill="#a34f32" text-anchor="start">BAT+ 对 BAT+</text><text x="808" y="392" font-size="18" fill="#283c33" text-anchor="start">BAT− 对 BAT−</text><rect x="80" y="485" width="1220" height="111" rx="6" fill="#fff0e8" stroke="#a34f32" stroke-width="2"/><text x="105" y="526" font-size="23" fill="#a34f32" text-anchor="start">停止点 E：在充电上限、电流和真实极性确认前，不接入电池，也不让USB给它充电。</text><text x="105" y="565" font-size="21" fill="#a34f32" text-anchor="start">不根据“正向线序”文字猜左右针位；按本块板丝印、原理图和成品插头测量确认。</text><text x="85" y="655" font-size="19" fill="#283c33" text-anchor="start">供应商交付：带PCM保护板与成品插头，不买裸电芯自行焊接；需要确认完整包装尺寸。</text><text x="85" y="686" font-size="19" fill="#283c33" text-anchor="start">建议工程首充目标：4.20V体系、约200mA，须先确认充电芯片档位与实际配置；本轮未改固件。</text><text x="85" y="717" font-size="19" fill="#283c33" text-anchor="start">LP503450规格有温度与电流限制；保护板不是正常充电控制器，不能用来补救错误充电电压。</text><text x="85" y="748" font-size="19" fill="#283c33" text-anchor="start">禁止USB 5V直连BAT；禁止增加第二块充电板与板载充电器并联；禁止带电轨道和裸露触点。</text><text x="85" y="779" font-size="19" fill="#283c33" text-anchor="start">首充在开放、不可燃的稳定表面有人看护；异常温升、异味、鼓包立即停止使用，不做破坏性测试。</text><text x="85" y="810" font-size="19" fill="#283c33" text-anchor="start">车体首版不增加电气接线。USB充电或调试时取出核心，避免线缆拖车和封闭壳体积热。</text><line x1="45" y1="930" x2="1355" y2="930" stroke="#283c33" stroke-width="2" /><text x="48" y="958" font-size="17" fill="#283c33" text-anchor="start">拾迹小火车  |  2026-09-13  |  按标注数字读图，不按显示或打印比例量取</text><text x="1350" y="958" font-size="17" fill="#a34f32" text-anchor="end">HOLD / 实测与试片后放行</text></g></svg>