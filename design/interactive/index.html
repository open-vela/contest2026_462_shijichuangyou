<style>
*{box-sizing:border-box}body{margin:0;color:#374832;background:radial-gradient(ellipse at 8% 12%,#fffaf0,transparent 62%),#eeede6;font-family:"Noto Sans CJK SC",sans-serif}main{max-width:1000px;margin:auto;padding:42px 26px}header{border-bottom:1px solid #d5d8ca;padding-bottom:23px;margin-bottom:32px}header p{font-size:11px;letter-spacing:3px;color:#727964;margin:0 0 10px}h1{font:400 clamp(25px,4vw,36px)/1.5 "Noto Serif CJK SC",serif;margin:0} .layout{display:grid;grid-template-columns:390px 1fr;gap:70px;align-items:center}.device{width:390px;max-width:100%;aspect-ratio:390/450;position:relative;overflow:hidden;box-shadow:0 14px 40px #33452d19;background:#f7f3e6}#display{position:absolute;top:0;left:0;width:390px;height:450px;transform-origin:top left;overflow:hidden;touch-action:none;user-select:none;--paper:#f7f3e6;--ink:#405334;--soft:#e5e8d6;--muted:#657154;--gold:#af9962;background:var(--paper);color:var(--ink)}#display:focus-visible{outline:2px solid var(--ink);outline-offset:-3px}#art{width:390px;height:450px;display:block}#art image{pointer-events:none}#caption{font-size:15px}.home-title{font:23px "Noto Serif CJK SC",serif;letter-spacing:6px}.home-copy{font-family:"Noto Sans CJK SC",sans-serif}.feedback{opacity:0;pointer-events:none}.responding .feedback{animation:hello .85s ease-out both}@keyframes hello{0%{opacity:0}25%,65%{opacity:1}100%{opacity:0}}[hidden]{display:none!important}.layer{position:absolute;inset:0}.page{background:var(--paper);padding:22px 24px;overflow:auto;touch-action:pan-y;user-select:text}.page:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 100% 0,var(--soft),transparent 66%);opacity:.8}.page>*{position:relative}.page-top{display:flex;align-items:center;gap:14px;margin-bottom:25px}.page-top h2{font:22px "Noto Serif CJK SC",serif;letter-spacing:2px;margin:0}.back,.edit-button,.confirm,.choice,.menu-item,.close-menu{font:inherit;color:var(--ink);cursor:pointer}.back{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--soft);border-radius:50%;background:transparent;flex-shrink:0}.back svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ink,#405334);outline-offset:3px}.clock{text-align:center;margin-top:57px}.clock .time{font:62px/1.1 "Noto Serif CJK SC",serif;font-variant-numeric:tabular-nums;letter-spacing:1px}.clock .date{font-size:17px;margin-top:18px}.eyebrow{font-size:12px;color:var(--muted);letter-spacing:2px}.footnote{font-size:12px;line-height:1.8;color:var(--muted)}.page-footer{position:absolute;left:24px;right:24px;bottom:22px;text-align:center}.edit-button{border:0;border-bottom:1px solid var(--muted);background:transparent;padding:10px 4px;font-size:15px;min-height:44px}.ticker{height:120px;margin:67px -24px 0;overflow:hidden;display:flex;align-items:center}.ticker-inner{white-space:nowrap;padding:0 24px;font:32px "Noto Serif CJK SC",serif;width:max-content}.ticker-inner.moving{animation:marquee var(--duration,12s) linear infinite}@keyframes marquee{from{transform:translateX(390px)}to{transform:translateX(-100%)}}.anniversary{text-align:center;margin-top:35px}.days{font:68px/1.2 "Noto Serif CJK SC",serif;margin:16px 0 6px}.day-date{font-size:16px}.empty-title{font:27px/1.7 "Noto Serif CJK SC",serif;margin:45px 0 14px}.choices{display:flex;gap:8px;margin:10px 0 19px}.choice{flex:1;min-height:49px;background:transparent;border:1px solid var(--soft);border-radius:3px;font-size:15px}.choice[aria-pressed=true]{background:var(--soft);border-color:var(--muted)}.page input,.page textarea{display:block;width:100%;border:1px solid var(--muted);background:var(--paper);color:var(--ink);padding:12px;font:18px/1.7 "Noto Sans CJK SC",sans-serif;user-select:text;border-radius:3px}.page textarea{height:135px;resize:none}.page label{display:block;font-size:14px;margin-bottom:10px}.confirm{width:100%;min-height:46px;margin-top:20px;background:var(--ink);color:var(--paper);border:0;border-radius:3px}.error{font-size:13px;min-height:22px;color:#a43a2f}.backdrop{background:#26342547;display:flex;align-items:flex-end}.sheet{width:100%;background:var(--paper);padding:19px 22px 15px;box-shadow:0 -8px 25px #17241414}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.sheet h2{margin:0;font:20px "Noto Serif CJK SC",serif;letter-spacing:2px}.close-menu{border:0;background:transparent;font-size:14px;min-height:40px;padding:0 7px}.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.menu-item{display:flex;align-items:center;gap:13px;min-height:66px;padding:12px;background:var(--soft);border:0;border-radius:3px;text-align:left;font-size:17px}.menu-item svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.35;flex-shrink:0}.menu-hint{margin:13px 0 0;text-align:center;color:var(--muted);font-size:11px}aside{font-size:14px;line-height:1.9}aside h2{font:25px "Noto Serif CJK SC",serif;margin:0 0 21px}dl{margin:0}dt{color:#394f32;margin-top:18px}dd{margin:3px 0 0;color:#717862;font-size:13px}.outside-buttons{display:flex;gap:10px;margin-top:27px;flex-wrap:wrap}.outside-buttons button{font:inherit;font-size:13px;border:1px solid #a3ae94;background:transparent;color:#374832;padding:9px 14px;cursor:pointer}.disclaimer{margin-top:25px;font-size:12px;color:#747c6a;border-top:1px solid #d5d8ca;padding-top:18px}#storage-status{color:#8b552d;font-size:12px}.back-link{font-size:12px;color:#596a4f;display:inline-block;margin-top:15px}@media(max-width:770px){main{padding:25px 18px}.layout{grid-template-columns:minmax(0,390px);justify-content:center;gap:30px}header{margin-bottom:24px}aside h2{font-size:22px}}@media(prefers-reduced-motion:reduce){.responding .feedback,.ticker-inner.moving{animation:none}.responding .feedback{opacity:1}.ticker{overflow-x:auto;touch-action:pan-x}.ticker-inner{white-space:normal;width:100%;font-size:27px}}
</style>
</head>
<body>
<main><header><p>拾迹创游 / 黄山派 390 × 450</p><h1>好看的时候，不需要菜单。</h1></header>
<div class="layout">
<div class="device"><div id="display" tabindex="0" aria-label="角色主屏：长按或上滑打开菜单，左右滑动切换角色，键盘回车打开菜单">
<svg id="art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 450" aria-label="角色收藏主屏" role="img">
<defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--paper)" stop-opacity="0"/><stop offset=".55" stop-color="var(--paper)" stop-opacity=".95"/><stop offset="1" stop-color="var(--paper)"/></linearGradient><radialGradient id="bg"><stop stop-color="var(--paper)"/><stop offset="1" stop-color="var(--soft)"/></radialGradient><pattern id="paper-grain" width="13" height="11" patternUnits="userSpaceOnUse"><circle cx="3" cy="5" r=".5" fill="var(--ink)" opacity=".09"/></pattern><g id="bloom" fill="var(--paper)" stroke="var(--gold)" stroke-width=".7"><ellipse cy="-5" rx="3.5" ry="5"/><ellipse cx="5" rx="5" ry="3.5"/><ellipse cy="5" rx="3.5" ry="5"/><ellipse cx="-5" rx="5" ry="3.5"/><circle r="2" fill="var(--gold)"/></g><g id="paw" fill="var(--gold)"><ellipse cy="3" rx="6" ry="4.5"/><ellipse cx="-6" cy="-4" rx="2.4" ry="3.3" transform="rotate(-15)"/><ellipse cy="-7" rx="2.4" ry="3.3"/><ellipse cx="6" cy="-4" rx="2.4" ry="3.3" transform="rotate(15)"/></g><g id="star" fill="var(--gold)"><path d="M0-9 2-2 9 0 2 2 0 9-2 2-9 0-2-2Z"/></g></defs>
<rect width="390" height="450" fill="url(#bg)"/><rect width="390" height="450" fill="url(#paper-grain)"/>
<g id="motifs"></g><image id="portrait" href="../../assets/portraits/taitai-v1.png" x="9" y="24" width="372" height="372" preserveAspectRatio="xMidYMid meet"/><rect y="330" width="390" height="120" fill="url(#fade)"/>
<g fill="none" stroke="var(--muted)" stroke-width=".75"><path d="M149 365Q162 368 173 365M217 365Q228 368 241 365"/></g><use id="signature-motif" href="#bloom" x="195" y="362" transform="translate(107.25 199.1) scale(.45)"/>
<text id="character-name" class="home-title" x="198" y="390" text-anchor="middle" fill="var(--ink)">苔苔</text><text id="caption" class="home-copy" x="195" y="417" text-anchor="middle" fill="var(--muted)">把喜欢，藏进春天。</text>
<g class="feedback" id="feedback"></g>
</svg>
<section class="page layer" id="page" hidden aria-label="功能页"></section>
<div class="backdrop layer" id="menu" hidden><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="menu-title"><div class="sheet-head"><h2 id="menu-title">随身小册</h2><button class="close-menu" id="close-menu">收起</button></div><div class="menu-grid">
<button class="menu-item" data-page="clock"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></svg>时钟</button>
<button class="menu-item" data-page="message"><svg viewBox="0 0 24 24"><path d="M4 4h16v13H9l-5 4Z M8 8h8M8 12h6"/></svg>文字应援</button>
<button class="menu-item" data-page="anniversary"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 2v6M16 2v6M4 11h16M8 15h3M8 18h5"/></svg>纪念日</button>
<button class="menu-item" data-page="appearance"><svg viewBox="0 0 24 24"><path d="M12 3C1 3 0 18 10 21c7 2 1-7 6-7 8 0 6-11-4-11Z"/><circle cx="7" cy="10" r="1"/><circle cx="12" cy="7" r="1"/><circle cx="17" cy="9" r="1"/></svg>外观</button>
</div><p class="menu-hint">点上方空白处，也可以收起</p></section></div>
</div></div>
<aside><h2>需要时，再轻轻唤出。</h2><dl><dt>长按 0.6 秒，或向上滑</dt><dd>打开底部菜单，不常驻悬浮按钮。</dd><dt>向左或向右滑</dt><dd>切换苔苔、暖暖、月月，装饰与功能页跟随角色。</dd><dt>轻点角色</dt><dd>短暂花叶、猫爪或星光回应，立绘本身不晃动。</dd><dt>进入功能页后</dt><dd>点左上角返回；输入文字和日期时不触发主屏手势。</dd></dl><div class="outside-buttons"><button id="demo-menu">演示菜单</button><button id="demo-next">下一位角色</button></div><p class="disclaimer">这些说明与演示按钮在设备画面外，不会放到主屏。此处是浏览器交互原型，不是板端固件；设置仅保存在当前浏览器，时钟来自电脑。未接入音频、灯效、蓝牙或电池数据。</p><p id="storage-status" role="status"></p><a class="back-link" href="../taitai-v1/">返回静态构图预览</a></aside>
</div></main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const display=$('display'), menu=$('menu'), page=$('page');
const characters=[
 {name:'苔苔',file:'taitai-v1.png',line:'把喜欢，藏进春天。',paper:'#f7f3e6',ink:'#405334',soft:'#e5e8d6',muted:'#657154',gold:'#af9962',motif:'bloom',x:9,y:24,size:372,decoration:'<path d="M17 67V23H66M324 427H373V383"/><path d="M35 98Q49 57 36 34M39 58Q18 42 21 31Q39 34 39 58M42 74Q64 56 62 44Q43 46 42 74"/>'},
 {name:'暖暖',file:'nuannuan-v1.png',line:'与你分享，今天的暖阳。',paper:'#fff1df',ink:'#68442d',soft:'#f2d8b7',muted:'#856246',gold:'#bb854c',motif:'paw',x:12,y:19,size:366,decoration:'<path d="M18 77V24H77M313 426H373V377"/><path d="M321 41h31v28h-31zM33 362l18 12-18 12"/>'},
 {name:'月月',file:'yueyue-v1.png',line:'把心愿，寄给今晚的月亮。',paper:'#edf0f7',ink:'#344967',soft:'#dce2ef',muted:'#63748c',gold:'#ad9b70',motif:'star',x:9,y:23,size:372,decoration:'<path d="M19 66V24H67M323 426H372V376"/><path d="M39 31a18 18 0 1 0 23 24 18 18 0 0 1-23-24ZM316 47l33 28-14 31"/><circle cx="316" cy="47" r="2"/><circle cx="349" cy="75" r="2"/>'}
];
let state={character:0,message:'每一天都与你相伴。',date:'',theme:'character'}, route='home', responseTimer;
const key='ebadge.rectangular-preview.v1';
function validDate(value){if(!/^20\d{2}-\d{2}-\d{2}$/.test(value))return false;const d=new Date(value+'T00:00:00Z');return Number.isFinite(d.getTime())&&d.toISOString().slice(0,10)===value&&value>='2024-01-01'&&value<='2099-12-31';}
try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved){if(Number.isInteger(saved.character)&&saved.character>=0&&saved.character<3)state.character=saved.character;if(typeof saved.message==='string'&&saved.message.trim()&&new TextEncoder().encode(saved.message).length<160)state.message=saved.message;if(validDate(saved.date))state.date=saved.date;if(['character','paper','night'].includes(saved.theme))state.theme=saved.theme;}}catch{ $('storage-status').textContent='浏览器存储不可用，本次设置可能无法保留。'; }
function save(){try{localStorage.setItem(key,JSON.stringify(state));}catch{$('storage-status').textContent='保存失败，本次设置仅在当前页面有效。';}}
function paint(){const c=characters[state.character];const colors=state.theme==='paper'?{...c,paper:'#f8f6ef',ink:'#43483b',soft:'#e9e7dc',muted:'#707463'}:state.theme==='night'?{...c,paper:'#222a31',ink:'#f4ebd8',soft:'#35414b',muted:'#c0c9cb'}:c;for(const k of ['paper','ink','soft','muted','gold'])display.style.setProperty('--'+k,colors[k]);$('portrait').setAttribute('href','../../assets/portraits/'+c.file);for(const k of ['x','y'])$('portrait').setAttribute(k,c[k]);for(const k of ['width','height'])$('portrait').setAttribute(k,c.size);$('character-name').textContent=c.name;$('caption').textContent=c.line;$('motifs').innerHTML='<g fill="none" stroke="var(--gold)" stroke-width=".9">'+c.decoration+'</g><use href="#'+c.motif+'" transform="translate(346 111) scale(.7)"/>';$('signature-motif').setAttribute('href','#'+c.motif);$('feedback').innerHTML='<use href="#'+c.motif+'" transform="translate(58 143) scale(1.1)"/><use href="#'+c.motif+'" transform="translate(328 287) scale(.9)"/>';}
function switchCharacter(delta){state.character=(state.character+delta+3)%3;save();paint();}
function respond(){if(display.classList.contains('responding'))return;display.classList.add('responding');clearTimeout(responseTimer);responseTimer=setTimeout(()=>display.classList.remove('responding'),900);}
const back='<div class="page-top"><button class="back" data-action="back" aria-label="返回角色主屏"><svg viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"/></svg></button><h2>';
function openMenu(){cancelGesture();if(route!=='home')return;display.classList.remove('responding');menu.hidden=false;$('art').setAttribute('aria-hidden','true');$('close-menu').focus();}
function closeMenu(){menu.hidden=true;$('art').removeAttribute('aria-hidden');display.focus({preventScroll:true});}
function home(){cancelGesture();route='home';page.hidden=true;page.replaceChildren();menu.hidden=true;$('art').removeAttribute('aria-hidden');display.focus({preventScroll:true});}
function showPage(next){cancelGesture();menu.hidden=true;route=next;page.hidden=false;$('art').setAttribute('aria-hidden','true');let title,body;
 if(next==='clock'){title='与你共度';body='<div class="clock"><div class="eyebrow">此刻 · 北京时间</div><div class="time" id="clock-time"></div><div class="date" id="clock-date"></div></div><p class="footnote page-footer">预览使用电脑时间 · 非板端 RTC</p>';}
 if(next==='message'){title='把喜欢说出来';body='<div class="ticker"><div class="ticker-inner" id="message-line"></div></div><div class="page-footer"><button class="edit-button" data-action="edit-message">编辑应援文字</button></div>';}
 if(next==='anniversary'){title='值得记住的日子';body='<div class="anniversary" id="anniversary-body"></div><div class="page-footer"><button class="edit-button" data-action="edit-date">设置纪念日</button></div>';}
 if(next==='appearance'){title='你的收藏';body='<p class="eyebrow">身边的角色</p><div class="choices">'+characters.map((c,i)=>'<button class="choice" data-character="'+i+'" aria-pressed="'+(i===state.character)+'">'+c.name+'</button>').join('')+'</div><p class="eyebrow">画面的底色</p><div class="choices">'+[['character','随角色'],['paper','素纸'],['night','夜读']].map(([id,name])=>'<button class="choice" data-theme="'+id+'" aria-pressed="'+(state.theme===id)+'">'+name+'</button>').join('')+'</div><p class="footnote">夜读仅改变界面底色，不会改变立绘颜色。<br>设置保存在当前浏览器，不同步到板子。</p>';}
 if(next==='edit-message'){title='写给喜欢';body='<form id="message-form"><label for="message-input">应援文字</label><textarea id="message-input" maxlength="159" required></textarea><p class="footnote">最多 159 个 UTF-8 字节，约 53 个常用汉字。</p><p class="error" id="form-error" role="alert"></p><button class="confirm" type="submit">保存文字</button></form>';}
 if(next==='edit-date'){title='选一个日子';body='<form id="date-form"><label for="date-input">纪念日期</label><input id="date-input" type="date" min="2024-01-01" max="2099-12-31" required><p class="footnote">按北京时间的日历日期计算，不按剩余小时取整。</p><p class="error" id="form-error" role="alert"></p><button class="confirm" type="submit">记住这一天</button></form>';}
 page.innerHTML=back+title+'</h2></div>'+body;
 page.querySelector('[data-action="back"]').setAttribute('aria-label',next.startsWith('edit-')?'取消编辑并返回':'返回角色主屏');
 if(next==='clock')updateClock();
 if(next==='message'){const line=$('message-line');line.textContent=state.message;if(line.scrollWidth>390){line.style.setProperty('--duration',Math.max(12,(line.scrollWidth+390)/32)+'s');line.classList.add('moving');}}
 if(next==='anniversary')updateAnniversary();
 if(next==='edit-message')$('message-input').value=state.message;
 if(next==='edit-date')$('date-input').value=state.date;
 page.querySelector('button').focus({preventScroll:true});
}
const dateParts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'});
function today(){const p=Object.fromEntries(dateParts.formatToParts(new Date()).map(x=>[x.type,x.value]));return p.year+'-'+p.month+'-'+p.day;}
function updateClock(){if(route!=='clock')return;$('clock-time').textContent=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date());$('clock-date').textContent=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'long',day:'numeric',weekday:'long'}).format(new Date());}
function updateAnniversary(){if(route!=='anniversary')return;const el=$('anniversary-body');if(!state.date){el.innerHTML='<div class="empty-title">留一个位置，<br>给特别的那一天。</div>';return;}const days=Math.round((Date.parse(state.date+'T00:00:00Z')-Date.parse(today()+'T00:00:00Z'))/86400000);el.innerHTML='<div class="eyebrow">'+(days>0?'距离那一天，还有':days<0?'从那一天，已经走过':'就是今天')+'</div><div class="days">'+(days===0?'今天':Math.abs(days))+'</div><div class="day-date">'+(days===0?'': '天 · ')+state.date+'</div>';}
function backPage(){if(route==='edit-message')showPage('message');else if(route==='edit-date')showPage('anniversary');else home();}
menu.addEventListener('click',e=>{if(e.target===menu||e.target.closest('#close-menu'))closeMenu();const item=e.target.closest('[data-page]');if(item)showPage(item.dataset.page);});
page.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.action==='back')backPage();else if(b.dataset.action==='edit-message')showPage('edit-message');else if(b.dataset.action==='edit-date')showPage('edit-date');else if(b.dataset.character!==undefined){state.character=Number(b.dataset.character);save();paint();showPage('appearance');}else if(b.dataset.theme){state.theme=b.dataset.theme;save();paint();showPage('appearance');}});
page.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='message-form'){const value=$('message-input').value.trim();if(!value||new TextEncoder().encode(value).length>=160){$('form-error').textContent='文字不能为空，且须少于 160 个 UTF-8 字节。';return;}state.message=value;save();showPage('message');}else if(e.target.id==='date-form'){const value=$('date-input').value;if(!validDate(value)){$('form-error').textContent='请选择 2024 至 2099 年的有效日期。';return;}state.date=value;save();showPage('anniversary');}});
let gesture=null,holdTimer=null;const pointers=new Set();
function cancelGesture(){clearTimeout(holdTimer);holdTimer=null;gesture=null;}
display.addEventListener('pointerdown',e=>{if(route!=='home'||!menu.hidden||e.button!==0)return;pointers.add(e.pointerId);if(pointers.size!==1){cancelGesture();return;}display.setPointerCapture(e.pointerId);const scale=390/display.getBoundingClientRect().width;gesture={id:e.pointerId,x:e.clientX,y:e.clientY,scale,max:0};holdTimer=setTimeout(()=>{if(gesture&&gesture.max<=10)openMenu();},600);});
display.addEventListener('pointermove',e=>{if(!gesture||gesture.id!==e.pointerId)return;const dx=(e.clientX-gesture.x)*gesture.scale,dy=(e.clientY-gesture.y)*gesture.scale;gesture.max=Math.max(gesture.max,Math.hypot(dx,dy));if(gesture.max>10){clearTimeout(holdTimer);holdTimer=null;}});
display.addEventListener('pointerup',e=>{pointers.delete(e.pointerId);if(!gesture||gesture.id!==e.pointerId)return;const g=gesture;cancelGesture();const dx=(e.clientX-g.x)*g.scale,dy=(e.clientY-g.y)*g.scale;if(route!=='home'||!menu.hidden)return;if(dy<-60&&Math.abs(dy)>Math.abs(dx)*1.35)openMenu();else if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.35)switchCharacter(dx<0?1:-1);else if(g.max<=10&&Math.hypot(dx,dy)<=10)respond();});
display.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);cancelGesture();});
display.addEventListener('lostpointercapture',()=>cancelGesture());
display.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('blur',()=>{cancelGesture();pointers.clear();});document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelGesture();pointers.clear();}});
display.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();if(!menu.hidden)closeMenu();else if(route!=='home')backPage();return;}if(!menu.hidden&&e.key==='Tab'){const buttons=[...menu.querySelectorAll('button')];if(e.shiftKey&&document.activeElement===buttons[0]){e.preventDefault();buttons.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===buttons.at(-1)){e.preventDefault();buttons[0].focus();}return;}if(route!=='home'||!menu.hidden)return;if(['Enter',' ','ArrowUp'].includes(e.key)){e.preventDefault();openMenu();}else if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();switchCharacter(e.key==='ArrowLeft'?-1:1);}});
$('demo-menu').addEventListener('click',()=>{home();openMenu();});$('demo-next').addEventListener('click',()=>{home();switchCharacter(1);});
new ResizeObserver(entries=>{display.style.transform='scale('+(entries[0].contentRect.width/390)+')';}).observe(document.querySelector('.device'));
paint();setInterval(()=>{updateClock();updateAnniversary();},1000);
</script>
</body></html>
